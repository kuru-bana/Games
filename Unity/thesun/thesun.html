<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>直視してはならない</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #1a1000; overflow: hidden; }
    #loading-screen {
      position: fixed; inset: 0; background: #1a1000;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; z-index: 100;
    }
    #loading-screen .thumb {
      width: 200px; height: 200px; object-fit: cover; border-radius: 8px;
      border: 1px solid #f39c12aa;
      box-shadow: 0 0 32px #f39c1266, 0 4px 24px #00000099;
      image-rendering: pixelated;
    }
    #loading-screen h2 {
      font-family: "Courier New", monospace; font-size: 20px; letter-spacing: 4px;
      color: #f5d76e; text-shadow: 0 0 16px #f39c1299;
    }
    #loading-screen .subtitle {
      font-family: "Courier New", monospace; font-size: 11px;
      color: #555; letter-spacing: 2px;
    }
    #loading-screen .progress-wrap {
      width: 280px; height: 4px; background: #2a1800; border-radius: 2px; overflow: hidden;
      border: 1px solid #7d5a00;
    }
    #loading-screen .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #8b6914, #f5d76e);
      width: 0%; transition: width 0.3s; border-radius: 2px;
    }
    #loading-screen .pct {
      font-family: "Courier New", monospace; color: #f39c12; font-size: 12px; letter-spacing: 2px;
    }
    #loading-screen .cdn-label {
      font-family: "Courier New", monospace; color: #2a2a2a; font-size: 10px; letter-spacing: 1px;
    }
    #gameContainer {
      display: none; position: fixed; inset: 0;
      background: #000; align-items: center; justify-content: center;
    }
    #gameContainer.active { display: flex; }
    #unity-canvas {
      display: block;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      max-width: 100vw; max-height: 100vh;
    }
  </style>
</head>
<body>
<div id="loading-screen">
  <img class="thumb"
    src="https://os-worker.unityroom.com/unityroom_production/icon/242436/icon_20251220_124055.png?h=1766202055"
    alt="直視してはならない" onerror="this.style.display='none'">
  <h2>直視してはならない</h2>
  <div class="subtitle">THE SUN</div>
  <div class="progress-wrap"><div class="progress-fill" id="pf"></div></div>
  <div class="pct" id="pct">0%</div>
  <div class="cdn-label" id="cdn-label">接続中...</div>
</div>
<div id="gameContainer">
  <canvas id="unity-canvas"></canvas>
</div>
<script>
(function () {
  var CDN = "https://cdn.jsdelivr.net/gh/kuru-bana/Games@main/Unity/thesun";
  var RAW = "https://raw.githubusercontent.com/kuru-bana/Games/main/Unity/thesun";
  var pfEl=document.getElementById("pf"),pctEl=document.getElementById("pct"),
      cdnLabel=document.getElementById("cdn-label"),loadingEl=document.getElementById("loading-screen"),
      container=document.getElementById("gameContainer"),canvas=document.getElementById("unity-canvas");
  var started=false;
  function showGame(){if(started)return;started=true;setTimeout(function(){loadingEl.style.display="none";container.classList.add("active");},800);}
  function showError(msg){loadingEl.innerHTML="<h2 style=\"color:#f5d76e;font-family:monospace;letter-spacing:4px;\">ERROR</h2><p style=\"color:#555;font-family:monospace;font-size:12px;text-align:center;max-width:300px;padding:0 20px;\">"+(msg||"読み込みに失敗しました")+"</p>";}
  function setProgress(p){var pct=Math.round(p*100);pfEl.style.width=pct+"%";pctEl.textContent=pct+"%";if(p>=1)showGame();}
  function startGame(){
    var config={dataUrl:RAW+"/webgl.data",frameworkUrl:CDN+"/webgl.framework.js",codeUrl:RAW+"/webgl.wasm",
      streamingAssetsUrl:"https://os-worker.unityroom.com/unityroom_production/game/70681/streaming_assets",
      companyName:"empty",productName:"empty",productVersion:"0"};
    cdnLabel.textContent="ゲームデータを読み込み中...";
    createUnityInstance(canvas,config,function(p){setProgress(p);}).then(function(){showGame();}).catch(function(m){showError(m);});
    setTimeout(showGame,180000);
  }
  function loadLoader(){
    var sources=[{url:CDN+"/webgl.loader.js",label:"jsDelivr"},{url:RAW+"/webgl.loader.js",label:"GitHub Raw"}];
    var idx=0;
    function tryNext(){if(idx>=sources.length){showError("ローダーの読み込みに失敗しました");return;}
      var src=sources[idx++];cdnLabel.textContent=src.label+" から接続中...";
      var s=document.createElement("script");s.src=src.url;
      s.onload=function(){cdnLabel.textContent=src.label+" 接続成功";startGame();};
      s.onerror=function(){tryNext();};document.body.appendChild(s);}
    tryNext();
  }
  loadLoader();
})();
</script>
</body>
</html>
