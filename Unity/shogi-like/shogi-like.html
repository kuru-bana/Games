<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>将棋ライク 〜将棋✖️ローグライク〜</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #1a1208; overflow: hidden; }
    #loading-screen {
      position: fixed; inset: 0; background: #1a1208;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; z-index: 100;
    }
    #loading-screen .thumb {
      width: 200px; height: 200px; object-fit: cover; border-radius: 8px;
      border: 1px solid #8b6914aa;
      box-shadow: 0 0 32px #8b691466, 0 4px 24px #00000099;
      image-rendering: pixelated;
    }
    #loading-screen h2 {
      font-family: "Courier New", monospace; font-size: 22px; letter-spacing: 4px;
      color: #c8a000; text-shadow: 0 0 16px #c8a00099;
    }
    #loading-screen .subtitle {
      font-family: "Courier New", monospace; font-size: 11px;
      color: #555; letter-spacing: 2px;
    }
    #loading-screen .progress-wrap {
      width: 280px; height: 4px; background: #2a1e00; border-radius: 2px; overflow: hidden;
      border: 1px solid #5a3a00;
    }
    #loading-screen .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #6b4900, #c8a000);
      width: 0%; transition: width 0.3s; border-radius: 2px;
    }
    #loading-screen .pct {
      font-family: "Courier New", monospace; color: #8b6914; font-size: 12px; letter-spacing: 2px;
    }
    #loading-screen .cdn-label {
      font-family: "Courier New", monospace; color: #2a2a2a; font-size: 10px; letter-spacing: 1px;
    }
    #gameContainer {
      display: none; position: fixed; inset: 0;
      background: #000; align-items: center; justify-content: center;
    }
    #gameContainer.active { display: flex; }
    #unity-canvas {
      display: block;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      max-width: 100vw; max-height: 100vh;
    }
  </style>
</head>
<body>
<div id="loading-screen">
  <img class="thumb"
    src="https://os-worker.unityroom.com/unityroom_production/icon/81089/icon_20240331_173412.gif?h=1711874052"
    alt="将棋ライク" onerror="this.style.display='none'">
  <h2>将棋ライク</h2>
  <div class="subtitle">将棋✖️ローグライク</div>
  <div class="progress-wrap"><div class="progress-fill" id="pf"></div></div>
  <div class="pct" id="pct">0%</div>
  <div class="cdn-label" id="cdn-label">接続中...</div>
</div>
<div id="gameContainer">
  <canvas id="unity-canvas"></canvas>
</div>
<script>
(function () {
  var CDN = "https://cdn.jsdelivr.net/gh/kuru-bana/Games@main/Unity/shogi-like";
  var RAW = "https://raw.githubusercontent.com/kuru-bana/Games/main/Unity/shogi-like";

  var pfEl     = document.getElementById("pf");
  var pctEl    = document.getElementById("pct");
  var cdnLabel = document.getElementById("cdn-label");
  var loadingEl= document.getElementById("loading-screen");
  var container= document.getElementById("gameContainer");
  var canvas   = document.getElementById("unity-canvas");

  var started = false;
  function showGame() {
    if (started) return; started = true;
    setTimeout(function () {
      loadingEl.style.display = "none";
      container.classList.add("active");
    }, 800);
  }
  function showError(msg) {
    loadingEl.innerHTML =
      "<h2 style=\"color:#c8a000;font-family:monospace;letter-spacing:4px;\">ERROR</h2>" +
      "<p style=\"color:#555;font-family:monospace;font-size:12px;text-align:center;max-width:300px;padding:0 20px;\">" +
      (msg || "読み込みに失敗しました") + "</p>";
  }
  function setProgress(p) {
    var pct = Math.round(p * 100);
    pfEl.style.width = pct + "%";
    pctEl.textContent = pct + "%";
    if (p >= 1) showGame();
  }
  function startGame() {
    var config = {
      dataUrl:            RAW + "/webgl.data",
      frameworkUrl:       CDN + "/webgl.framework.js",
      codeUrl:            RAW + "/webgl.wasm",
      streamingAssetsUrl: "https://os-worker.unityroom.com/unityroom_production/game/48135/streaming_assets",
      companyName:        "empty",
      productName:        "empty",
      productVersion:     "0"
    };
    cdnLabel.textContent = "ゲームデータを読み込み中...";
    createUnityInstance(canvas, config, function (progress) {
      setProgress(progress);
    }).then(function () {
      showGame();
    }).catch(function (message) {
      showError(message);
    });
    setTimeout(showGame, 180000);
  }
  function loadLoader() {
    var sources = [
      { url: CDN + "/webgl.loader.js", label: "jsDelivr" },
      { url: RAW + "/webgl.loader.js", label: "GitHub Raw" }
    ];
    var idx = 0;
    function tryNext() {
      if (idx >= sources.length) { showError("ローダーの読み込みに失敗しました"); return; }
      var src = sources[idx++];
      cdnLabel.textContent = src.label + " から接続中...";
      var s = document.createElement("script");
      s.src = src.url;
      s.onload = function () { cdnLabel.textContent = src.label + " 接続成功"; startGame(); };
      s.onerror = function () { tryNext(); };
      document.body.appendChild(s);
    }
    tryNext();
  }
  loadLoader();
})();
</script>
</body>
</html>
