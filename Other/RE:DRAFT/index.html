  <script>
    function loadGame() {
      const introView = document.getElementById('intro-view');
      const gameView = document.getElementById('game-view');
      const gameLoading = document.getElementById('game-loading');
      const disclaimer = document.getElementById('site-disclaimer');

      gameLoading.classList.add('visible');
      introView.classList.add('fade-out');

      // Enable game CSS
      document.getElementById('game-css').removeAttribute('media');

      // Execute game JS from inline script
      const jsCode = document.getElementById('game-js-src').textContent;
      const blob = new Blob([jsCode], { type: 'application/javascript' });
      const blobUrl = URL.createObjectURL(blob);

      const script = document.createElement('script');
      script.type = 'module';
      script.src = blobUrl;
      script.onload = function() {
        URL.revokeObjectURL(blobUrl);
        setTimeout(function() {
          gameLoading.classList.remove('visible');
          gameView.classList.add('visible');
          disclaimer.style.display = 'block';
          introView.style.display = 'none';
        }, 400);
      };
      script.onerror = function(e) {
        // Fallback: try eval approach
        try {
          URL.revokeObjectURL(blobUrl);
          const mod = new Function(jsCode);
          mod();
          setTimeout(function() {
            gameLoading.classList.remove('visible');
            gameView.classList.add('visible');
            disclaimer.style.display = 'block';
            introView.style.display = 'none';
          }, 400);
        } catch(err) {
          gameLoading.querySelector('span').textContent = '読み込みに失敗しました: ' + err.message;
        }
      };
      document.head.appendChild(script);
    }

    document.getElementById('enter-game').addEventListener('click', loadGame);
    document.getElementById('enter-game').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') loadGame();
    });
  </script>

  </body>
