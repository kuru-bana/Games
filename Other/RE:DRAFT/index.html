<script>
  const CDN_BASE = 'https://cdn.jsdelivr.net/gh/kuru-bana/Games@main/redraft/';

  function loadGame() {
    const introView = document.getElementById('intro-view');
    const gameView = document.getElementById('game-view');
    const gameLoading = document.getElementById('game-loading');
    const disclaimer = document.getElementById('site-disclaimer');

    // Show loading
    gameLoading.classList.add('visible');
    introView.classList.add('fade-out');

    // Load game CSS
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = CDN_BASE + 'assets/main-D4w37a_u.css';
    document.head.appendChild(link);

    // Wait for CSS then load JS
    link.onload = function() {
      // Dynamically import the game JS module
      const script = document.createElement('script');
      script.type = 'module';
      script.crossOrigin = 'anonymous';
      script.src = CDN_BASE + 'assets/main-CihQlYSk.js';
      script.onload = function() {
        // Give React time to mount
        setTimeout(function() {
          gameLoading.classList.remove('visible');
          gameView.classList.add('visible');
          disclaimer.style.display = 'block';
          introView.style.display = 'none';
        }, 300);
      };
      script.onerror = function() {
        gameLoading.querySelector('span').textContent = '読み込みに失敗しました。ページを再読み込みしてください。';
      };
      document.body.appendChild(script);
    };

    link.onerror = function() {
      link.onload();
    };
  }

  // Enter game on quote card click
  document.getElementById('enter-game').addEventListener('click', loadGame);
  document.getElementById('enter-game').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') loadGame();
  });
</script>
